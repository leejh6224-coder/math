<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>입체도형 접기 놀이</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: graph-paper work mat on the left, a stack of controls on the right; stacks to one column on phones */
:root {
  --paper: #fbfaf6;
  --grid: #e3e6ee;
  --ink: #2b2a3a;
  --muted: #6a6880;
  --panel: #ffffff;
  --line: #d9d8e4;
  --accent: #b8338f;
  --accent-ink: #ffffff;
  --accent-soft: #f6e3f0;
  --edge3d: #3a3850;
  --font-display: "Jua", "Gowun Dodum", system-ui, sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1b1a24; --grid: #2a2936; --ink: #ecebf5; --muted: #a6a4bb;
    --panel: #24232f; --line: #3a3948; --accent: #e070bd; --accent-ink: #1b1a24;
    --accent-soft: #3c2537; --edge3d: #1a1922; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1b1a24; --grid: #2a2936; --ink: #ecebf5; --muted: #a6a4bb;
  --panel: #24232f; --line: #3a3948; --accent: #e070bd; --accent-ink: #1b1a24;
  --accent-soft: #3c2537; --edge3d: #1a1922; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  box-sizing: border-box;
}
* { box-sizing: border-box; }
.app { max-width: 1120px; margin: 0 auto; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 320px; grid-template-rows: auto 1fr; height: 100%; min-height: 560px; }
header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.9rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
header p { margin: 0; color: var(--muted); }

.stage {
  position: relative; min-width: 0; min-height: 360px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
.hint { position: absolute; left: 12px; bottom: 12px; font-size: 0.82rem; color: var(--muted); background: var(--panel); border: 1px solid var(--line); padding: 4px 10px; border-radius: 99px; pointer-events: none; }

aside { display: flex; flex-direction: column; gap: 14px; min-width: 0; overflow-y: auto; }
.block { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.label { font-size: 0.75rem; letter-spacing: 0.08em; color: var(--muted); }

.shapes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.shapes button {
  font-family: var(--font-display); font-size: 1rem; padding: 9px 4px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer;
}
.shapes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.fold-row { display: flex; align-items: center; gap: 10px; }
.fold-row input { flex: 1; min-width: 0; accent-color: var(--accent); }
.pct { font-variant-numeric: tabular-nums; width: 3.2em; text-align: right; font-family: var(--font-display); }
.play {
  font-family: var(--font-display); font-size: 1.1rem; padding: 10px; border-radius: 10px; border: none;
  background: var(--accent); color: var(--accent-ink); cursor: pointer;
}
.play:hover { filter: brightness(1.06); }

.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px var(--accent-soft); }
.row-btns { display: flex; gap: 6px; }
.ghost { flex: 1; font-family: var(--font-body); font-size: 0.9rem; padding: 7px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }

.info h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; margin: 0; }
.info p { margin: 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: var(--accent-soft); border-radius: 10px; padding: 8px; text-align: center; }
.stat b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.78rem; color: var(--muted); }
.tip { font-size: 0.88rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; height: auto; }
  .stage { height: 60vh; min-height: 320px; }
  aside { overflow: visible; }
}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>입체도형 접기 놀이</h1>
    <p>전개도를 색칠하고 접어서 입체도형을 만들어 봐요.</p>
  </header>

  <div class="stage" id="stage">
    <canvas id="c" aria-label="전개도와 입체도형 3D 화면"></canvas>
    <div class="hint">드래그해서 돌려 보기 · 면을 눌러 색칠하기</div>
  </div>

  <aside>
    <div class="block">
      <div class="label">도형 고르기</div>
      <div class="shapes" id="shapes"></div>
    </div>

    <div class="block">
      <div class="label">접기</div>
      <div class="fold-row">
        <input type="range" id="fold" min="0" max="100" value="0" aria-label="접힌 정도">
        <span class="pct" id="pct">0%</span>
      </div>
      <button class="play" id="play">접기 ▶</button>
    </div>

    <div class="block">
      <div class="label">색칠하기</div>
      <div class="swatches" id="swatches"></div>
      <div class="row-btns">
        <button class="ghost" id="auto">알록달록 칠하기</button>
        <button class="ghost" id="clear">모두 지우기</button>
      </div>
    </div>

    <div class="block info" id="info"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  const PALETTE = ['#ffffff', '#e04fa5', '#ff8a3d', '#ffd23f', '#4cc38a', '#3aa0e8', '#8a63d2'];
  const PAPER = '#ffffff';

  // ---------- three.js setup ----------
  const canvas = document.getElementById('c');
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
  camera.position.set(6.5, 8, 9);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.minDistance = 6; controls.maxDistance = 22;
  controls.target.set(0, 0.6, 0);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8888aa, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.55);
  sun.position.set(4, 10, 6); scene.add(sun);

  const root = new THREE.Group();
  scene.add(root);

  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  const edgeMat = new THREE.LineBasicMaterial({ color: cssVar('--edge3d') || '#3a3850' });
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const refreshTheme = () => edgeMat.color.set(cssVar('--edge3d') || '#3a3850');
  mq.addEventListener ? mq.addEventListener('change', refreshTheme) : mq.addListener(refreshTheme);
  new MutationObserver(refreshTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ---------- builders ----------
  let faces = [], hinges = [], deformers = [];

  function makeMat(color) {
    return new THREE.MeshStandardMaterial({ color, side: THREE.DoubleSide, roughness: 0.85, metalness: 0,
      polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
  }
  // points given as [x, z] in the flat (XZ) plane
  function polyGeo(pts) {
    const s = new THREE.Shape();
    pts.forEach(([x, z], i) => i ? s.lineTo(x, -z) : s.moveTo(x, -z));
    const g = new THREE.ShapeGeometry(s);
    g.rotateX(-Math.PI / 2);
    return g;
  }
  const rect = (x0, x1, z0, z1) => polyGeo([[x0, z0], [x1, z0], [x1, z1], [x0, z1]]);
  function circleGeo(r, offsetZ) {
    const g = new THREE.CircleGeometry(r, 56);
    g.rotateX(-Math.PI / 2);
    g.translate(0, 0, offsetZ);
    return g;
  }
  function addFace(parent, geo) {
    const mesh = new THREE.Mesh(geo, makeMat(PAPER));
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 20), edgeMat));
    parent.add(mesh);
    faces.push(mesh);
    return mesh;
  }
  // a hinge sits on an edge; its local +z points away from the parent face.
  function hinge(parent, x, z, yaw, angle) {
    const outer = new THREE.Group();
    outer.position.set(x, 0, z);
    outer.rotation.y = yaw;
    parent.add(outer);
    const h = new THREE.Group();
    outer.add(h);
    hinges.push({ h, angle });
    return h;
  }
  // a bendable surface: flat params -> position(t)
  function addDeformable(parent, segU, segV, mapFn, boundaryParams) {
    const geo = new THREE.PlaneGeometry(1, 1, segU, segV);
    const uv = geo.attributes.uv.array;
    const params = [];
    for (let i = 0; i < uv.length; i += 2) params.push([uv[i], uv[i + 1]]);
    const mesh = new THREE.Mesh(geo, makeMat(PAPER));
    const lineGeo = new THREE.BufferGeometry();
    lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(boundaryParams.length * 3), 3));
    const outline = new THREE.LineLoop(lineGeo, edgeMat);
    parent.add(mesh); parent.add(outline);
    faces.push(mesh);
    const v = new THREE.Vector3();
    deformers.push((t) => {
      const pos = geo.attributes.position;
      params.forEach(([a, b], i) => { mapFn(a, b, t, v); pos.setXYZ(i, v.x, v.y, v.z); });
      pos.needsUpdate = true;
      geo.computeVertexNormals();
      geo.computeBoundingSphere();
      const lp = lineGeo.attributes.position;
      boundaryParams.forEach(([a, b], i) => { mapFn(a, b, t, v); lp.setXYZ(i, v.x, v.y, v.z); });
      lp.needsUpdate = true;
    });
    return mesh;
  }
  function boundary(n) {
    const pts = [];
    for (let i = 0; i < n; i++) pts.push([i / n, 0]);
    for (let i = 0; i < n; i++) pts.push([1, i / n]);
    for (let i = 0; i < n; i++) pts.push([1 - i / n, 1]);
    for (let i = 0; i < n; i++) pts.push([0, 1 - i / n]);
    return pts;
  }

  // ---------- shapes ----------
  const SHAPES = {
    cube: {
      name: '정육면체',
      desc: '똑같은 정사각형 6개로 만든 상자 모양이에요.',
      stats: [['6', '면'], ['12', '모서리'], ['8', '꼭짓점']],
      tip: '정육면체 전개도는 모두 11가지가 있어요. 십자 모양은 그중 하나예요.',
      flat: [0, 0, 1], folded: [0, 1, 0],
      build() {
        addFace(root, rect(-1, 1, -1, 1));
        [[0, 1, 0], [1, 0, Math.PI / 2], [0, -1, Math.PI], [-1, 0, -Math.PI / 2]].forEach(([x, z, yaw]) => {
          const h = hinge(root, x, z, yaw, Math.PI / 2);
          addFace(h, rect(-1, 1, 0, 2));
          if (yaw === 0) addFace(hinge(h, 0, 2, 0, Math.PI / 2), rect(-1, 1, 0, 2));
        });
      }
    },
    pyramid: {
      name: '사각뿔',
      desc: '밑면은 사각형 1개, 옆면은 삼각형 4개예요.',
      stats: [['5', '면'], ['8', '모서리'], ['5', '꼭짓점']],
      tip: '옆면의 삼각형들이 위에서 한 점(각뿔의 꼭짓점)에 모여요.',
      flat: [0, 0, 0], folded: [0, 0.8, 0],
      build() {
        const h = 1.7, s = Math.hypot(h, 1), ang = Math.PI - Math.atan2(h, 1);
        addFace(root, rect(-1, 1, -1, 1));
        [[0, 1, 0], [1, 0, Math.PI / 2], [0, -1, Math.PI], [-1, 0, -Math.PI / 2]].forEach(([x, z, yaw]) => {
          addFace(hinge(root, x, z, yaw, ang), polyGeo([[-1, 0], [1, 0], [0, s]]));
        });
      }
    },
    prism: {
      name: '삼각기둥',
      desc: '밑면은 삼각형 2개, 옆면은 직사각형 3개예요.',
      stats: [['5', '면'], ['9', '모서리'], ['6', '꼭짓점']],
      tip: '두 밑면은 서로 평행하고 모양과 크기가 같아요.',
      flat: [0, 0, 0], folded: [0, 0.8, 0],
      build() {
        const L = 1.4;
        addFace(root, rect(-1, 1, -L, L));
        [[1, Math.PI / 2], [-1, -Math.PI / 2]].forEach(([x, yaw]) => {
          addFace(hinge(root, x, 0, yaw, 2 * Math.PI / 3), rect(-L, L, 0, 2));
        });
        [[L, 0], [-L, Math.PI]].forEach(([z, yaw]) => {
          addFace(hinge(root, 0, z, yaw, Math.PI / 2), polyGeo([[-1, 0], [1, 0], [0, Math.sqrt(3)]]));
        });
      }
    },
    cylinder: {
      name: '원기둥',
      desc: '밑면은 원 2개, 옆면은 굽은 면 1개예요.',
      stats: [['2', '밑면 (원)'], ['1', '옆면'], ['0', '꼭짓점']],
      tip: '옆면을 펼치면 직사각형! 가로 길이는 밑면의 둘레와 같아요. 반지름이 1cm면 2 × 3.14 × 1 = 6.28cm.',
      flat: [0, 0, 0], folded: [0, 1, 0],
      build() {
        const r = 1, H = 2.4, W = 2 * Math.PI * r;
        addDeformable(root, 72, 1, (a, b, t, out) => {
          const u = (a - 0.5) * W, z = (0.5 - b) * H;
          if (t < 1e-4) return out.set(u, 0, z);
          const R = r / t;
          out.set(R * Math.sin(u / R), R * (1 - Math.cos(u / R)), z);
        }, boundary(72));
        addFace(hinge(root, 0, H / 2, 0, Math.PI / 2), circleGeo(r, r));
        addFace(hinge(root, 0, -H / 2, Math.PI, Math.PI / 2), circleGeo(r, r));
      }
    },
    cone: {
      name: '원뿔',
      desc: '밑면은 원 1개, 옆면은 굽은 면 1개예요.',
      stats: [['1', '밑면 (원)'], ['1', '옆면'], ['1', '꼭짓점']],
      tip: '옆면을 펼치면 부채꼴 모양이에요. 부채꼴의 호 길이는 밑면의 둘레와 같아요.',
      flat: [0, 0, 2.2], folded: [0, 0.9, 1.3],
      build() {
        const r = 1, L = 2.6, phi = 2 * Math.PI * r / L, beta1 = Math.asin(r / L);
        addDeformable(root, 64, 16, (a, b, t, out) => {
          const psi = (a - 0.5) * phi, rho = b * L;
          const sb = 1 - t * (1 - r / L), cb = Math.sqrt(1 - sb * sb);
          const th = psi / sb;
          const x = rho * sb * Math.sin(th), y = -rho * cb, z = rho * sb * Math.cos(th);
          const A = Math.asin(sb) - Math.PI / 2, ca = Math.cos(A), sa = Math.sin(A);
          out.set(x, -(y * ca - z * sa), y * sa + z * ca);
        }, (() => {
          const pts = [];
          for (let i = 0; i <= 48; i++) pts.push([i / 48, 1]);
          pts.push([1, 0]);
          return pts;
        })());
        addFace(hinge(root, 0, L, 0, Math.PI / 2 + beta1), circleGeo(r, r));
      }
    }
  };

  // ---------- state ----------
  let current = 'cube';
  let t = 0, target = null, brush = PALETTE[1];

  function build(key) {
    current = key;
    while (root.children.length) root.remove(root.children[0]);
    faces = []; hinges = []; deformers = [];
    SHAPES[key].build();
    autoColor();
    apply();
    renderInfo();
    document.querySelectorAll('#shapes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.key === key));
  }

  function apply() {
    hinges.forEach(({ h, angle }) => { h.rotation.x = -t * angle; });
    deformers.forEach(fn => fn(t));
    const s = SHAPES[current];
    root.position.set(
      -(s.flat[0] + (s.folded[0] - s.flat[0]) * t),
      -(s.flat[1] + (s.folded[1] - s.flat[1]) * t),
      -(s.flat[2] + (s.folded[2] - s.flat[2]) * t)
    );
    const pct = Math.round(t * 100);
    document.getElementById('fold').value = pct;
    document.getElementById('pct').textContent = pct + '%';
    document.getElementById('play').textContent = t > 0.5 ? '펼치기 ◀' : '접기 ▶';
  }

  function autoColor() {
    const pool = PALETTE.slice(1);
    faces.forEach((f, i) => f.material.color.set(pool[i % pool.length]));
  }

  function renderInfo() {
    const s = SHAPES[current];
    document.getElementById('info').innerHTML =
      `<h2>${s.name}</h2><p>${s.desc}</p>` +
      `<div class="stats">${s.stats.map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('')}</div>` +
      `<p class="tip">${s.tip}</p>`;
  }

  // ---------- UI ----------
  const shapesEl = document.getElementById('shapes');
  Object.entries(SHAPES).forEach(([key, s]) => {
    const b = document.createElement('button');
    b.textContent = s.name; b.dataset.key = key;
    b.addEventListener('click', () => { target = null; t = 0; build(key); });
    shapesEl.appendChild(b);
  });

  const swEl = document.getElementById('swatches');
  PALETTE.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'swatch'; b.style.background = c;
    b.setAttribute('aria-label', i === 0 ? '흰색 (지우개)' : '색 ' + i);
    b.setAttribute('aria-pressed', c === brush);
    b.addEventListener('click', () => {
      brush = c;
      swEl.querySelectorAll('.swatch').forEach(x => x.setAttribute('aria-pressed', x === b));
    });
    swEl.appendChild(b);
  });
  document.getElementById('auto').addEventListener('click', autoColor);
  document.getElementById('clear').addEventListener('click', () => faces.forEach(f => f.material.color.set(PAPER)));

  document.getElementById('fold').addEventListener('input', e => { target = null; t = e.target.value / 100; apply(); });
  document.getElementById('play').addEventListener('click', () => { target = t > 0.5 ? 0 : 1; });

  // painting: tap without dragging
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let downAt = null;
  canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
  canvas.addEventListener('pointerup', e => {
    if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(faces, false)[0];
    if (hit) hit.object.material.color.set(brush);
  });

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(h, 1);
    // on tall/narrow screens keep the horizontal view as wide as on desktop
    camera.fov = camera.aspect < 1
      ? Math.min(64, 2 * Math.atan(Math.tan(19 * Math.PI / 180) / camera.aspect) * 180 / Math.PI)
      : 38;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    if (target !== null) {
      const step = dt / 1.6;
      t = target > t ? Math.min(target, t + step) : Math.max(target, t - step);
      apply();
      if (t === target) target = null;
    }
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  build('cube');
  requestAnimationFrame(loop);
})();
